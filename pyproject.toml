[tool.coverage.run]
branch = true
omit = ["config.py", "config-3.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[tool.poe.tasks]
deploy = "robotpy deploy"
download = "robotpy sync --no-install"
sim = "robotpy sim"
test = "robotpy test"
type-check = "mypy ."

[tool.pyright]
exclude = [
    "ctre_sim",
    "logs",
    # Default excludes
    "**/__pycache__",
    "**/.*",
]

[tool.pytest]
addopts = ["--maxfail=2"]
faulthandler_timeout = "60"
pythonpath = ["."]
strict = true
testpaths = ["tests"]
verbosity_test_cases = "1"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pyflakes
    "F",
    # flake8-bugbear
    "B",
    # isort
    "I",
    # pyupgrade
    "UP",
    # flake8-comprehensions
    "C4",
    # flake8-logging-format
    "G",
    # flake8-simplify
    "SIM",
    # flake8-print
    "T20",
    # perflint
    "PERF",
    # refurb
    "FURB",
    # ruff specific
    "RUF021", # parenthesise chained and/or
]
ignore = [
    "E501", # long lines
    "B905", # zip() without strict=
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "hypothesis>=6.112.1",
    "mypy>=1.19.1",
    "pytest>=9.0.1",
    "pytest-integration>=0.2.3",
]

[tool.uv]
prerelease = "allow"

[project]
name = "pyrebuilt"
version = "0.0.0"
description = "raf attempts to make a robot drive"
authors = [{ name = "Raf Maguire", email = "git@raf.zip" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "robotpy-wpilib-utilities",
    "robotpy[apriltag,commands2]",
    "wpilib==2027.0.0a6"
]

[tool.robotpy]
requires = [
    "robotpy-wpilib-utilities",
    "wpilib==2027.0.0a6"
]
robotpy_version = "2027.0.0a6"
components = ["apriltag", "commands2"]
